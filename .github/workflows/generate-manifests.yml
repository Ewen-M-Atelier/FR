# .github/workflows/generate-manifests.yml
#
# S'exécute automatiquement à chaque push contenant
# de nouvelles photos dans N'IMPORTE QUEL dossier photos-*/
#
# ── ACTIVATION (une seule fois) ──────────────────────
# Sur GitHub → votre dépôt → Settings
#   → Actions → General → Workflow permissions
#   → Cocher "Read and write permissions" → Save
# ─────────────────────────────────────────────────────
#
# GÉNÉRIQUE : ce workflow scanne automatiquement TOUS les
# dossiers du dépôt dont le nom commence par "photos-".
# Pour ajouter un nouveau modèle ou une nouvelle galerie,
# il suffit de créer le dossier photos-nom-du-modele/ et
# d'y déposer des photos — aucune modification de ce
# fichier n'est nécessaire.

name: Mise à jour catalogue photos

on:
  push:
    branches: [ main ]
    paths:
      - 'photos-**'   # déclenché par TOUT dossier commençant par "photos-"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer photos.json
        run: |
          python3 - << 'PYEOF'
          import json, os

          PREFIXE = 'photos-'
          # Tous les formats image courants
          EXT = {'.jpg','.jpeg','.png','.webp','.gif','.heic','.heif','.avif','.bmp'}

          manifest = {}

          # Recherche dynamique de TOUS les dossiers photos-* à la racine du dépôt
          dossiers = sorted([
              d for d in os.listdir('.')
              if os.path.isdir(d) and d.startswith(PREFIXE)
          ])

          if not dossiers:
              print("Aucun dossier photos-* trouvé.")

          for dossier in dossiers:
              cle = dossier[len(PREFIXE):]  # ex: "photos-autres-modeles" -> "autres-modeles"
              files = sorted([
                  f for f in os.listdir(dossier)
                  if os.path.splitext(f.lower())[1] in EXT
              ])
              manifest[cle] = files
              print(f"  {cle}: {len(files)} photo(s)")

          with open('photos.json', 'w', encoding='utf-8') as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
          print("photos.json généré !")
          PYEOF

      - name: Commit et push photos.json si modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans photos.json"
          else
            git commit -m "Mise à jour automatique de photos.json"
            git push
          fi
